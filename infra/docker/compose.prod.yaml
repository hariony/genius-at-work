# Stack de production de l'API, sur le VPS (dossier /srv/gaw).
# Aucun port n'est publié : le trafic entre uniquement par le Cloudflare Tunnel (cloudflared).
# Les secrets sont lus dans /srv/gaw/.env (modèle : prod.env.example), jamais dans Git.
# L'image de l'API est choisie par le script de déploiement (API_IMAGE).

name: gaw

x-api: &api
  image: ${API_IMAGE:?API_IMAGE manquant}
  restart: unless-stopped
  depends_on:
    mysql:
      condition: service_healthy
  environment:
    APP_ENV: prod
    APP_SECRET: ${APP_SECRET:?}
    DEFAULT_URI: https://api.genius-at-work.com
    SITE_URL: ${SITE_URL:-https://genius-at-work.com}
    DATABASE_URL: mysql://${MYSQL_USER:?}:${MYSQL_PASSWORD:?}@mysql:3306/${MYSQL_DATABASE:?}?serverVersion=8.4.0&charset=utf8mb4
    MESSENGER_TRANSPORT_DSN: doctrine://default?auto_setup=0
    MAILER_DSN: ${MAILER_DSN:?}
    MAILER_FROM: ${MAILER_FROM:-noreply@genius-at-work.com}
    ADMIN_HOST: ${ADMIN_HOST:-office.genius-at-work.com}
    CONTACT_TEAM_EMAIL: ${CONTACT_TEAM_EMAIL:-contact@genius-at-work.com}
    TURNSTILE_SECRET_KEY: ${TURNSTILE_SECRET_KEY:?}
    CORS_ALLOW_ORIGIN: ${CORS_ALLOW_ORIGIN:-^https://(www\.)?genius-at-work\.com$}
    # cloudflared est sur le réseau Docker privé : l'IP réelle vient de X-Forwarded-For.
    TRUSTED_PROXIES: private_ranges
  volumes:
    # Images envoyées depuis le back-office (même règle que mysql-data : jamais supprimé).
    - media-data:/app/public/media
  logging:
    driver: json-file
    options:
      max-size: 10m
      max-file: '5'

services:
  api:
    <<: *api

  worker:
    <<: *api
    command:
      [
        'php',
        'bin/console',
        'messenger:consume',
        'async',
        '--time-limit=3600',
        '--memory-limit=128M',
      ]
    healthcheck:
      disable: true
    depends_on:
      api:
        condition: service_healthy

  # Une seule instance : les tâches planifiées (anonymisation RGPD) ne doivent pas tourner en double.
  scheduler:
    <<: *api
    command:
      [
        'php',
        'bin/console',
        'messenger:consume',
        'scheduler_default',
        '--time-limit=3600',
        '--memory-limit=128M',
      ]
    healthcheck:
      disable: true
    depends_on:
      api:
        condition: service_healthy

  mysql:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:?}
      MYSQL_USER: ${MYSQL_USER:?}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?}
    command: ['--character-set-server=utf8mb4', '--collation-server=utf8mb4_unicode_ci']
    volumes:
      # Volume nommé : jamais supprimé par le déploiement (pas de « down -v »).
      - mysql-data:/var/lib/mysql
    healthcheck:
      test:
        ['CMD-SHELL', 'mysqladmin ping -h 127.0.0.1 -u"$$MYSQL_USER" -p"$$MYSQL_PASSWORD" --silent']
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s

  # api.genius-at-work.com → http://api:8080 (route configurée dans le tableau de bord Zero Trust).
  cloudflared:
    image: cloudflare/cloudflared:2026.10.1
    restart: unless-stopped
    command: ['tunnel', '--no-autoupdate', 'run']
    environment:
      TUNNEL_TOKEN: ${CLOUDFLARE_TUNNEL_TOKEN:?}
    depends_on:
      api:
        condition: service_healthy

volumes:
  mysql-data:
  media-data:
