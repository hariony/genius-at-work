framework:
    cache:
        # Préfixe stable des clés : le cache survit aux déploiements.
        prefix_seed: genius-at-work/api
        # Cache applicatif en fichiers (var/cache), sans serveur de cache : limites d'envoi du
        # formulaire (lues par l'API) et état des tâches planifiées (lu par le worker). Vidé à
        # chaque déploiement, sans conséquence : les limites repartent de zéro, et une tâche
        # nocturne manquée est rattrapée (Schedule::processOnlyLastMissedRun).
