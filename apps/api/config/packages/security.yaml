security:
    password_hashers:
        Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface: 'auto'

    providers:
        # Comptes créés en ligne de commande (app:admin:create), jamais depuis le web.
        admin_users:
            entity:
                class: App\Infrastructure\Security\AdminUser
                property: email

    firewalls:
        dev:
            pattern: ^/(_profiler|_wdt)/
            security: false
        # Back-office : session, formulaire de connexion protégé par CSRF, double authentification,
        # tentatives limitées (mot de passe et code).
        admin:
            pattern: ^/admin
            lazy: true
            provider: admin_users
            form_login:
                login_path: admin_login
                check_path: admin_login
                default_target_path: admin_leads
                enable_csrf: true
            two_factor:
                auth_form_path: admin_2fa_login
                check_path: admin_2fa_check
                default_target_path: admin_leads
                enable_csrf: true
            login_throttling:
                max_attempts: 5
                interval: '15 minutes'
            logout:
                path: admin_logout
                enable_csrf: true
                target: admin_login
        # API publique : sans état, aucune authentification (le formulaire de contact est anonyme).
        main:
            security: false

    access_control:
        - { path: ^/admin/logout$, roles: PUBLIC_ACCESS }
        - { path: ^/admin/2fa, roles: IS_AUTHENTICATED_2FA_IN_PROGRESS }
        - { path: ^/admin/login$, roles: PUBLIC_ACCESS }
        - { path: ^/admin/assets/, roles: PUBLIC_ACCESS }
        - { path: ^/admin, roles: ROLE_ADMIN }

when@test:
    security:
        password_hashers:
            # Hachage volontairement lent en production ; au minimum en test.
            Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface:
                algorithm: auto
                cost: 4
                time_cost: 3
                memory_cost: 10
