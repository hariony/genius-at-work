api_platform:
    title: Genius At Work API
    description: 'API du site genius-at-work.com : demandes de contact, contenu éditorial lu par le site au build.'
    version: 1.0.0
    formats:
        json: ['application/json']
        jsonld: ['application/ld+json']
    docs_formats:
        jsonopenapi: ['application/vnd.openapi+json']
        html: ['text/html']
    defaults:
        stateless: true
        cache_headers:
            vary: ['Content-Type', 'Authorization', 'Origin']

when@prod:
    api_platform:
        # Documentation interactive désactivée en production (spécification OpenAPI conservée).
        enable_swagger_ui: false
        enable_re_doc: false
